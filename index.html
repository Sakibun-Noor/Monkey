<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#08090c">
<meta name="mobile-web-app-capable" content="content">
<title>Dynamic Monkey Player</title>
<link rel="icon" href="assets/favicon.jpg">
<link rel="stylesheet" href="css/player.css">
<!-- The script imports five more modules, which the browser can only discover once
     player.js has arrived; naming them here fetches them in parallel instead of a
     round trip later. -->
<link rel="modulepreload" href="js/player.js">
<link rel="modulepreload" href="js/mix.js">
<link rel="modulepreload" href="js/comments.js">
<link rel="modulepreload" href="js/pop.js">
<link rel="modulepreload" href="js/track.js">
<link rel="modulepreload" href="js/actions.js">
<link rel="modulepreload" href="data/media.js">
<link rel="modulepreload" href="data/comment-sets.js">
</head>
<body>

<div class="rotate-gate" aria-hidden="true">
  <div class="rotate-gate__inner">
    <div class="rotate-gate__icon">📱</div>
    <p>Rotate to portrait</p>
  </div>
</div>

<main class="shell">
  <section class="stage" id="stage" aria-label="Monkey video player">

    <video id="video" class="stage__video" playsinline webkit-playsinline muted
           preload="auto" poster="assets/video/poster.jpg" src="assets/video/monkey.mp4"></video>

    <div class="stage__scrim" aria-hidden="true"></div>
    <div class="stage__fade" id="fade" aria-hidden="true"></div>

    <!-- Comment overlay: pure HTML/CSS, never baked into the video -->
    <div class="comments" id="comments" aria-live="polite" aria-label="Live comments"></div>

    <header class="hud" id="hud">
      <div class="hud__row">
        <span class="hud__chip" id="chipSet">Set —</span>
        <span class="hud__chip" id="chipNarrator">Narrator —</span>
        <span class="hud__chip" id="chipMusic">Music —</span>
      </div>
      <p class="hud__count" id="chipCombo"></p>
    </header>

    <button class="bigplay" id="bigPlay" type="button" aria-label="Play">
      <svg class="icon-bigplay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
      <svg class="icon-bigpause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>
      <svg class="icon-bigrepeat" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7.5 6 12 10V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>

    <div class="controls" id="controls">
      <div class="scrub">
        <div class="scrub__track" id="scrubTrack">
          <div class="scrub__buffer" id="scrubBuffer"></div>
          <div class="scrub__fill" id="scrubFill"></div>
          <div class="scrub__knob" id="scrubKnob"></div>
        </div>
        <input class="scrub__input" id="scrub" type="range" min="0" max="1000" value="0"
               step="1" aria-label="Seek">
      </div>
      <div class="controls__row">
        <button class="btn btn--icon" id="playToggle" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>
        </button>
        <span class="controls__time" id="time">0:00 / 0:44</span>
        <button class="btn btn--icon" id="muteToggle" type="button" aria-label="Mute">
          <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4zm11.4-1a5 5 0 0 1 0 7v-2a3 3 0 0 0 0-3zm1.6-3.1a8 8 0 0 1 0 13.2v-2a6 6 0 0 0 0-9.2z"/></svg>
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4zm11.3.1 1.4-1.4 2 2 2-2 1.4 1.4-2 2 2 2-1.4 1.4-2-2-2 2-1.4-1.4 2-2z"/></svg>
        </button>
      </div>
    </div>

    <!-- Right-hand action column, laid over the picture. Counts are filled in by
         js/actions.js and stay blank until the traffic service is reachable. -->
    <nav class="rail" id="rail" aria-label="Actions">
      <button class="rail__btn" id="likeBtn" type="button" aria-label="Like" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.6-4.7-9.7-9.3C.8 8.2 3 4.8 6.3 4.8c1.9 0 3.4 1 4.2 2.3h1c.8-1.3 2.3-2.300 4.200-2.300 3.300 0 5.500 3.400 4 6.900C19.600 16.300 12 21 12 21z"/></svg>
        <span class="rail__label" id="likeCount"></span>
      </button>
      <div class="rail__btn rail__btn--static" role="img" aria-label="Plays">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.500 5 2.500 9.200 1 12c1.500 2.800 5.500 7 11 7s9.500-4.200 11-7c-1.500-2.800-5.500-7-11-7zm0 11.500a4.500 4.500 0 1 1 0-9 4.500 4.500 0 0 1 0 9zm0-2.500a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <span class="rail__label" id="playCount"></span>
      </div>
      <button class="rail__btn" id="shareBtn" type="button" aria-label="Share">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l7.500 7.500L14 19v-4.300c-4.800 0-8.200 1.400-10.800 5C3.900 14 7.300 9.200 14 8.200V4z"/></svg>
        <span class="rail__label" id="shareCount">Share</span>
      </button>
      <button class="rail__btn" id="saveBtn" type="button" aria-label="Save">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.500L5 21V4a1 1 0 0 1 1-1z"/></svg>
        <span class="rail__label">Save</span>
      </button>
      <button class="rail__btn" id="replay" type="button" aria-label="Remix: play a new mix">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h3c3.500 0 5 12 8.500 12H21"/>
          <path d="M3 18h3c3.500 0 5-12 8.500-12H21"/>
          <polyline points="18,3 21,6 18,9"/>
          <polyline points="18,15 21,18 18,21"/>
        </svg>
        <span class="rail__label">Remix</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </section>

  <p class="shell__note">Portrait phone player — best viewed on a mobile device.</p>
</main>

<script type="module" src="js/player.js"></script>
</body>
</html>
